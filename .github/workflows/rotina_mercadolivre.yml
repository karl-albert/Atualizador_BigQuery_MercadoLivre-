name: Rotina Mercado Livre - BigQuery & Microsoft Fabric (7x ao Dia)

on:
  schedule:
    # 05h00 Horario de Brasilia (BRT / UTC-3) -> 08h00 UTC
    - cron: '0 5 * * *'
    # 08h00 Horario de Brasilia (BRT / UTC-3) -> 11h00 UTC
    - cron: '0 8 * * *'
    # 11h00 Horario de Brasilia (BRT / UTC-3) -> 13h00 UTC
    - cron: '0 11 * * *'
    # 15h00 Horario de Brasilia (BRT / UTC-3) -> 18h00 UTC
    - cron: '0 15 * * *'
    # 18h00 Horario de Brasilia (BRT / UTC-3) -> 21h00 UTC
    - cron: '0 18 * * *'
    # 21h00 Horario de Brasilia (BRT / UTC-3) -> 0h00 UTC
    - cron: '0 21 * * *'
    # 00h00 Horario de Brasilia (BRT / UTC-3) -> 03h00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite execucao manual a qualquer momento via painel do GitHub ou celular
  push:
    branches:
      - main

jobs:
  atualizar-mercadolivre:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Coleta, Carga no BigQuery e Sincronizacao com Joca Bot
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'mercado-livre-mais-vendidos' }}
          DATASET_ID: 'Mercado_Livre'
          TABELA_ID: 'Fato_MercadoLivre_MaisVendidos'
          POWERBI_REFRESH_WEBHOOK: ${{ secrets.POWERBI_REFRESH_WEBHOOK }}
        run: |
          python atualizar_mercadolivre.py
