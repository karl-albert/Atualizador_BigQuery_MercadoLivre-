name: Rotina Mercado Livre - BigQuery & Microsoft Fabric (3x ao Dia)

on:
  schedule:
    # 08h00 Horario de Brasilia (BRT / UTC-3) -> 11h00 UTC
    - cron: '0 11 * * *'
    # 18h00 Horario de Brasilia (BRT / UTC-3) -> 21h00 UTC
    - cron: '0 21 * * *'
    # 23h00 Horario de Brasilia (BRT / UTC-3) -> 02h00 UTC (dia seguinte)
    - cron: '0 2 * * *'
  workflow_dispatch: # Permite execucao manual a qualquer momento via painel do GitHub ou celular
  push:
    branches:
      - main

jobs:
  atualizar-mercadolivre:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Coleta, Carga no BigQuery e Sincronizacao com Joca Bot
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'mercado-livre-mais-vendidos' }}
          DATASET_ID: 'Mercado_Livre'
          TABELA_ID: 'Fato_MercadoLivre_MaisVendidos'
        run: |
          python atualizar_mercadolivre.py

      - name: Disparar Atualizacao no Microsoft Fabric (OneLake / Direct Lake)
        continue-on-error: true
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          FABRIC_WEBHOOK_URL: ${{ secrets.FABRIC_WEBHOOK_URL }}
          WORKSPACE_ID: "0c2a1a5e-4519-4e4e-b3e6-14288c11291d"
          PIPELINE_ID_MELI: ${{ secrets.PIPELINE_ID_MELI }}
          DATASET_ID_MELI: ${{ secrets.DATASET_ID_MELI }}
        run: |
          python disparar_fabric_mercadolivre.py
