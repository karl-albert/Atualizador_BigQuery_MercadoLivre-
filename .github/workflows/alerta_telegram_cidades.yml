name: Alerta ML Cidades - Faturamento Diário (11h00 e 15h00 BRT)

on:
  schedule:
    # 11h00 e 15h00 Horário de Brasília (BRT / UTC-3) -> 14h00 e 18h00 UTC
    - cron: '0 14,18 * * *'
  workflow_dispatch: # Permite disparo manual imediato a qualquer momento

jobs:
  enviar-alerta-cidades:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Consulta e Enviar Posição em 1 Linha (Telegram e E-mail)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'mercado-livre-mais-vendidos' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || '8916733671:AAH1htvd6VqDKsngdyYsFOaXdvNgUQ0RjyM' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '891673367' }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
        run: |
          python enviar_alerta_diario_cidades.py
